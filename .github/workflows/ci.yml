# CI: lint, typecheck and tests on every PR to main and on push to main.
# A failing step fails the whole workflow (default GitHub Actions behavior),
# which blocks merge per docs/TESTING.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validation:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
