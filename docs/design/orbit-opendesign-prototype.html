<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit — три варианта мобильного интерфейса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}

:root {
  --phone-screen-width: 412px;
  --phone-screen-height: 915px;
  --phone-bezel: 10px;
  --phone-outer-radius: 46px;
  --phone-screen-radius: 38px;
  --phone-safe-top: 52px;
  --phone-safe-bottom: 28px;
  --phone-system-fg: #17181a;
  --phone-screen-bg: #f6f7f9;
  --phone-stage-bg: #e8eaee;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh;
  display: block;
  padding: 32px 24px 48px;
  background:
    radial-gradient(circle at 50% 8%, rgba(255,255,255,.95), transparent 40%),
    var(--phone-stage-bg);
  color: #191a1d;
  font-family: Roboto, "Noto Sans", system-ui, sans-serif;
}

.phone-frame {
  position: relative;
  width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
  height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
  padding: var(--phone-bezel);
  border-radius: var(--phone-outer-radius);
  background:
    linear-gradient(145deg, rgba(255,255,255,.2), transparent 18%),
    linear-gradient(155deg, #414348 0%, #23252a 44%, #0c0d10 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.13),
    inset 0 0 0 2px rgba(0,0,0,.84),
    0 34px 72px -22px rgba(8,10,14,.56),
    0 11px 25px -10px rgba(8,10,14,.34);
  isolation: isolate;
}
.phone-frame::before,
.phone-frame::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 92px;
  bottom: 92px;
  width: 2px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,.14) 18%, transparent 32%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
}
.phone-frame::before { left: 0; }
.phone-frame::after { right: 0; }

.hardware-button {
  position: absolute;
  right: -3px;
  width: 4px;
  border-radius: 3px;
  background: linear-gradient(90deg, #08090b, #2d3036 62%, #08090b);
  box-shadow: inset 0 1px rgba(255,255,255,.1);
}
.hardware-button.volume { top: 205px; height: 92px; }
.hardware-button.power { top: 322px; height: 70px; background: linear-gradient(90deg, #08090b, #3c424c 62%, #08090b); }

.phone-screen {
  position: relative;
  width: var(--phone-screen-width);
  height: var(--phone-screen-height);
  overflow: hidden;
  border-radius: var(--phone-screen-radius);
  background: var(--phone-screen-bg);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
}

.phone-content {
  position: absolute;
  inset: 0;
  overflow: hidden;
  padding-top: var(--phone-safe-top);
  padding-bottom: var(--phone-safe-bottom);
  background: var(--phone-screen-bg);
}

.punch-hole {
  position: absolute;
  z-index: 20;
  top: 14px;
  left: 50%;
  width: 14px;
  height: 14px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #283343 0 10%, #090b0f 30%, #000 72%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 0 3px #000;
  pointer-events: none;
}

.status-bar {
  position: absolute;
  z-index: 15;
  inset: 0 0 auto;
  height: var(--phone-safe-top);
  display: grid;
  grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
  align-items: start;
  padding: 14px 19px 0;
  color: var(--phone-system-fg);
  pointer-events: none;
}
.status-time { justify-self: start; display: flex; align-items: center; height: 16px; font-size: 14px; font-weight: 600; line-height: 1; letter-spacing: .01em; }
.status-cutout-zone { width: 64px; }
.status-icons { justify-self: end; display: inline-flex; align-items: center; height: 16px; gap: 5px; }
.status-icons svg { display: block; flex: none; fill: currentColor; }
.status-icons .wifi { width: 15px; height: 12px; }
.status-icons .cellular { width: 14px; height: 12px; }
.status-icons .battery { width: 9px; height: 14px; }

.gesture-indicator {
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 8px;
  width: 108px;
  height: 4px;
  transform: translateX(-50%);
  border-radius: 99px;
  background: var(--phone-system-fg);
  opacity: .86;
  pointer-events: none;
}

@media (max-height: 998px) { .phone-frame { zoom: 0.9; } }
@media (max-height: 904px) { .phone-frame { zoom: 0.82; } }
@media (max-height: 829px) { .phone-frame { zoom: 0.74; } }
@media (max-height: 754px) { .phone-frame { zoom: 0.66; } }
@media (max-width: 480px) {
  body { padding: 0; }
  .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
  .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
  .phone-screen { width: 100%; height: 100%; border-radius: 0; }
}

/* ===== catalog (review surface, outside the handset) ===== */
.od-shell {
  max-width: 1080px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 336px minmax(0, 1fr);
  gap: 44px;
  align-items: start;
}
.catalog { position: sticky; top: 8px; }
.cat-brand { font-family: "Unbounded", system-ui, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -.02em; color: #14161a; }
.cat-tag { margin-top: 6px; font-size: 13px; color: #5c626c; }
.cat-note { margin: 10px 0 0; font-size: 12px; line-height: 1.5; color: #838991; }
.tabs { display: flex; flex-direction: column; gap: 8px; margin: 22px 0 0; }
.tab {
  display: flex; align-items: center; gap: 10px;
  min-height: 46px; padding: 0 14px;
  border: 1px solid #d8dce2; border-radius: 12px; background: #fff;
  font: inherit; font-size: 15px; font-weight: 600; color: #2a2e36;
  text-align: left; cursor: pointer; transition: border-color .15s, background .15s;
}
.tab:hover { border-color: #b7bec8; }
.tab.is-on { border-color: #14161a; background: #14161a; color: #fff; }
.cat-info { margin-top: 22px; padding: 18px; border: 1px solid #dde1e7; border-radius: 16px; background: rgba(255,255,255,.72); }
.ci-name { font-size: 15px; font-weight: 700; color: #14161a; }
.ci-dir { margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: #3c424b; }
.ci-list { margin: 14px 0 0; display: grid; gap: 8px; }
.ci-list div { display: grid; gap: 2px; }
.ci-list dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a9099; }
.ci-list dd { margin: 0; font-size: 13px; line-height: 1.45; color: #2a2e36; }
.ci-swatches { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; }
.sw { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5c626c; }
.sw i { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.cat-states { margin-top: 20px; }
.cat-states-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a9099; margin-bottom: 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid #d8dce2; border-radius: 12px; overflow: hidden; background: #fff; }
.seg-btn { min-height: 40px; border: 0; border-right: 1px solid #e2e5ea; background: transparent; font: inherit; font-size: 12.5px; font-weight: 600; color: #3c424b; cursor: pointer; }
.seg-btn:last-child { border-right: 0; }
.seg-btn.is-on { background: #14161a; color: #fff; }
.cat-foot { margin: 22px 0 0; font-size: 12px; line-height: 1.5; color: #7a8088; }
.stage { display: flex; justify-content: center; }

@media (max-width: 920px) {
  .od-shell { grid-template-columns: 1fr; gap: 28px; }
  .catalog { position: static; }
  .stage { order: 2; }
}

/* ===== app tokens ===== */
.app.v-a {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #15171c; --muted: #6a7180; --line: #e4e7ec;
  --accent: #0e7c6b; --accent-ink: #ffffff; --accent-soft: #e6f2f0;
  --due: #b45309; --due-bg: #fdf3e7; --due-line: #f0d9b5;
  --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  --pad: 18px; --gap: 12px;
  --font-display: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Golos Text", system-ui, sans-serif;
  --fs-title: 21px; --fs-body: 16px; --fs-small: 14px; --fs-tiny: 12px;
}
.app.v-b {
  --bg: #f4f5f8; --surface: #ffffff; --ink: #171a21; --muted: #6b7280; --line: #e6e8ee;
  --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eceafe;
  --due: #e11d48; --due-bg: #fde7ec; --due-line: #f6c2cd;
  --radius: 14px; --radius-sm: 10px; --radius-lg: 22px;
  --pad: 16px; --gap: 10px;
  --font-display: "Unbounded", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Unbounded", system-ui, sans-serif;
  --fs-title: 20px; --fs-body: 15px; --fs-small: 13px; --fs-tiny: 11px;
}
.app.v-c {
  --bg: #fafafb; --surface: #ffffff; --ink: #1a1a1e; --muted: #6e6e76; --line: #e7e7ea;
  --accent: #1d4ed8; --accent-ink: #ffffff; --accent-soft: #e8edfd;
  --due: #b42318; --due-bg: #fdecea; --due-line: #eec9c4;
  --radius: 6px; --radius-sm: 4px; --radius-lg: 8px;
  --pad: 22px; --gap: 14px;
  --font-display: "Lora", Georgia, "Times New Roman", serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, monospace;
  --fs-title: 22px; --fs-body: 16px; --fs-small: 14px; --fs-tiny: 12px;
}

.app {
  position: relative;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.45;
}
.app button { font-family: inherit; }
.app :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.app-screen { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.app-body { overflow-y: auto; overscroll-behavior: contain; padding: 6px var(--pad) 24px; }
.app-bar { padding: 6px var(--pad) 14px; background: var(--bg); }
.bar-row { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.bar-back {
  flex: none; display: grid; place-items: center; width: 40px; height: 40px; margin-left: -8px;
  border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); cursor: pointer;
}
.bar-back:hover { background: var(--accent-soft); }
.bar-titles { display: grid; gap: 1px; min-width: 0; }
.bar-title { font-family: var(--font-display); font-size: var(--fs-title); font-weight: 600; letter-spacing: -.01em; }
.bar-sub { font-size: var(--fs-tiny); color: var(--muted); }
.app-foot { padding: 12px var(--pad) 14px; border-top: 1px solid var(--line); background: var(--surface); }
.app-foot:empty { display: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: var(--fs-body); font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, opacity .15s;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-block { width: 100%; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn[aria-disabled="true"]:hover { border-color: var(--accent); filter: none; }
.foot-hint { display: block; margin-top: 8px; text-align: center; font-size: var(--fs-tiny); color: var(--muted); }

.banner {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 4px 0 14px; padding: 12px 14px; border-radius: var(--radius);
  border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink);
}
.banner.is-out { opacity: 0; transition: opacity .2s; }
.banner-main { min-width: 0; }
.banner-title { display: block; font-weight: 700; font-size: var(--fs-small); }
.banner-line { display: block; font-size: var(--fs-small); color: var(--muted); margin-top: 2px; }
.banner-close { flex: none; width: 32px; height: 32px; margin: -4px -6px -4px 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: var(--radius-sm); font-size: 18px; line-height: 1; }
.banner-close:hover { background: rgba(0,0,0,.06); }

.avatar {
  flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: var(--fs-small);
}
.due-chip {
  flex: none; align-self: flex-start; padding: 4px 9px; border-radius: 999px;
  background: var(--due-bg); color: var(--due); border: 1px solid var(--due-line);
  font-size: var(--fs-tiny); font-weight: 700; white-space: nowrap;
}

/* ---------- variant A: quiet list ---------- */
.v-a .sec { margin-top: 18px; }
.v-a .sec:first-child { margin-top: 6px; }
.sec-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 8px; }
.sec-title { margin: 0; font-size: var(--fs-tiny); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.sec-count { font-size: var(--fs-tiny); font-weight: 700; color: var(--due); }
.rows { list-style: none; margin: 0; padding: 0; }
.row-a {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px;
  padding: 12px 2px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: inherit; text-align: left; cursor: pointer;
}
.row-a:hover { background: rgba(0,0,0,.02); }
.rows-due .row-a:last-child, .rows .row-a:last-child { border-bottom: 0; }
.row-a-main { display: grid; gap: 3px; }
.row-a-name { font-weight: 600; font-size: var(--fs-body); }
.row-a-meta { font-size: var(--fs-small); color: var(--muted); }
.row-a-when { flex: none; font-size: var(--fs-small); color: var(--muted); }
.rows-due .row-a-name { color: var(--due); }

/* ---------- variant B: rhythm cards ---------- */
.v-b .sec { margin-top: 16px; }
.v-b .sec:first-child { margin-top: 4px; }
.card-b { margin-bottom: 10px; }
.card-b-tap {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-lg);
  background: var(--surface); color: inherit; cursor: pointer; box-shadow: 0 4px 14px rgba(23,26,33,.05);
}
.card-b-tap:hover { border-color: var(--accent); }
.card-b.is-due .card-b-tap { border-color: var(--due-line); background: var(--due-bg); }
.card-b-main { display: grid; gap: 4px; }
.card-b-name { font-weight: 700; font-size: var(--fs-body); }
.card-b-note { font-size: var(--fs-small); color: var(--muted); }
.card-b-meta { font-size: var(--fs-tiny); color: var(--muted); }
.ring {
  flex: none; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%;
  background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--p, 0) * 1%), var(--line) 0);
}
.ring-in { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--surface); font-family: var(--font-num); font-weight: 700; font-size: 16px; color: var(--ink); }

/* ---------- variant C: journal ledger ---------- */
.v-c .sec { margin-top: 20px; }
.v-c .sec:first-child { margin-top: 6px; }
.sec-title-c { margin: 0 0 10px; font-family: var(--font-display); font-style: italic; font-size: 17px; font-weight: 500; color: var(--muted); }
.ledger { list-style: none; margin: 0; padding: 0; }
.entry-c {
  display: flex; align-items: flex-start; gap: 16px; width: 100%;
  padding: 15px 0; border: 0; border-top: 1px solid var(--line);
  background: transparent; color: inherit; text-align: left; cursor: pointer;
}
.entry-c:hover { background: rgba(0,0,0,.015); }
.gutter-c { flex: none; display: grid; justify-items: center; width: 46px; }
.gutter-num { font-family: var(--font-num); font-size: 22px; font-weight: 600; line-height: 1; color: var(--ink); }
.gutter-unit { font-family: var(--font-num); font-size: 10px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.entry-c-main { display: grid; gap: 3px; }
.entry-c-name { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.entry-c-note { font-size: var(--fs-small); color: var(--muted); }
.entry-c-when { font-size: var(--fs-tiny); color: var(--muted); }
.entry-c-mark { flex: none; align-self: center; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--due); }

/* ---------- add form ---------- */
.form { display: grid; gap: 20px; padding-top: 6px; }
.field { display: grid; gap: 6px; }
.label { display: block; font-size: var(--fs-small); font-weight: 600; }
.req { font-weight: 500; color: var(--due); font-size: var(--fs-tiny); }
.opt { font-weight: 500; color: var(--muted); font-size: var(--fs-tiny); }
.input {
  width: 100%; min-height: 48px; padding: 12px 14px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.input::placeholder { color: var(--muted); opacity: .8; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { resize: none; min-height: 84px; line-height: 1.5; }
.err { font-size: var(--fs-small); color: var(--due); font-weight: 600; }
.strategy { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; }
.helper { margin: 0; font-size: var(--fs-small); color: var(--muted); }
.sopt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  padding: 14px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: inherit; cursor: pointer;
}
.sopt:hover { border-color: var(--accent); }
.sopt.is-on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.sopt-mark { flex: none; width: 20px; height: 20px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.sopt.is-on .sopt-mark { border-color: var(--accent); box-shadow: inset 0 0 0 4px var(--accent); }
.sopt-main { display: grid; gap: 4px; }
.sopt-title { font-weight: 700; font-size: var(--fs-body); }
.sopt-desc { font-size: var(--fs-small); color: var(--muted); }
.v-b .sopt { border-radius: var(--radius-lg); }
.v-b .sopt-mark { border-radius: 6px; }
.v-b .sopt.is-on .sopt-mark { border-radius: 6px; box-shadow: inset 0 0 0 4px var(--accent); }
.v-c .sopt { border-radius: var(--radius-sm); }
.v-c .sopt-title { font-family: var(--font-display); font-size: 18px; }

/* ---------- contact card ---------- */
.contact { padding-top: 6px; }
.c-name { display: block; font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
.c-note { margin: 12px 0 0; font-size: var(--fs-body); color: var(--ink); }
.c-h { margin: 26px 0 10px; font-size: var(--fs-tiny); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

.contact-a .c-head { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.c-due { justify-self: start; padding: 4px 9px; border-radius: 999px; font-size: var(--fs-tiny); font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.c-due.is-due { background: var(--due-bg); color: var(--due); }
.c-strategy { font-size: var(--fs-small); color: var(--muted); }
.c-facts { margin: 0; display: grid; gap: 0; }
.c-fact { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.c-fact dt { font-size: var(--fs-small); color: var(--muted); }
.c-fact dd { margin: 0; text-align: right; font-weight: 600; }
.c-fact-sub { grid-column: 1 / -1; text-align: right !important; font-weight: 400 !important; font-size: var(--fs-tiny) !important; color: var(--muted); }

.contact-b .c-b-top { display: flex; align-items: center; gap: 14px; }
.contact-b .c-strategy-chip { display: inline-block; margin-top: 4px; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-tiny); font-weight: 700; }
.c-b-due { margin-top: 14px; padding: 10px 12px; border-radius: var(--radius); background: var(--due-bg); color: var(--due); font-size: var(--fs-small); font-weight: 700; border: 1px solid var(--due-line); }
.c-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.c-tile { display: grid; gap: 4px; padding: 12px 10px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.c-tile-v { font-family: var(--font-num); font-size: 18px; font-weight: 600; }
.c-tile-l { font-size: 10.5px; color: var(--muted); line-height: 1.25; }

.contact-c .c-c-kicker { font-size: var(--fs-tiny); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.contact-c .c-c-name { margin: 6px 0 0; font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.15; }
.contact-c .c-c-strategy { margin: 6px 0 0; font-family: var(--font-display); font-style: italic; font-size: 16px; color: var(--muted); }
.contact-c .c-c-note { margin: 16px 0 0; font-size: var(--fs-body); line-height: 1.6; }
.c-c-ledger { margin-top: 20px; border-top: 1px solid var(--line); }
.c-c-ledger > div { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.c-c-l { font-size: var(--fs-small); color: var(--muted); }
.c-c-v { font-family: var(--font-num); font-size: var(--fs-small); text-align: right; }
.c-c-v.is-due { color: var(--due); font-weight: 600; }

/* ---------- history ---------- */
.hist { list-style: none; margin: 0; padding: 0; }
.hist-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.hist-item:last-child { border-bottom: 0; }
.hist-date { flex: none; width: 78px; font-size: var(--fs-small); color: var(--muted); }
.hist-main { display: grid; gap: 2px; }
.hist-init { font-weight: 600; font-size: var(--fs-small); }
.hist-out { font-size: var(--fs-tiny); color: var(--muted); }
.hist-empty { margin: 0; padding: 14px; border: 1px dashed var(--line); border-radius: var(--radius); font-size: var(--fs-small); color: var(--muted); }
.contact-c .hist-date { font-family: var(--font-num); width: 84px; }
.contact-c .hist-init { font-family: var(--font-display); font-size: 15px; }

/* ---------- states ---------- */
.state { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 48px 20px; }
.state-icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.state-title { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.state-text { margin: 0; max-width: 30ch; font-size: var(--fs-small); color: var(--muted); line-height: 1.55; }
.state .btn { margin-top: 4px; min-width: 200px; }
.skel { padding-top: 8px; }
.skel-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.skel-av { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--line); }
.skel-line { height: 11px; border-radius: 6px; background: var(--line); }
.skel-line.w70 { width: 62%; }
.skel-line.w45 { width: 40%; margin-top: 8px; }
.skel-row { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

/* ---------- sheet ---------- */
.sheet-scrim { position: absolute; inset: 0; z-index: 40; display: flex; align-items: flex-end; background: rgba(12,14,18,.42); }
.sheet {
  width: 100%; max-height: 88%; overflow-y: auto; padding: 10px var(--pad) 18px;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--surface); box-shadow: 0 -12px 40px rgba(8,10,14,.28);
  animation: sheetin .22s ease-out;
}
@keyframes sheetin { from { transform: translateY(14px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
.sheet-grip { width: 40px; height: 4px; margin: 0 auto 14px; border-radius: 99px; background: var(--line); }
.sheet-title { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.sheet-sub { margin: 4px 0 16px; font-size: var(--fs-small); color: var(--muted); }
.sheet-group { margin-bottom: 16px; }
.sheet-group > .label { margin-bottom: 8px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { min-height: 52px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); font-size: var(--fs-small); font-weight: 600; cursor: pointer; text-align: center; }
.opt:hover { border-color: var(--accent); }
.opt.is-on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.sheet .err { display: block; margin: -6px 0 12px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<script>
(function () {
  "use strict";

  var DAY = 86400000;
  var nowMs = function () { return Date.now(); };
  var daysAgo = function (n) { return new Date(nowMs() - n * DAY); };
  var addDays = function (d, n) { return new Date(d.getTime() + n * DAY); };
  var startOfDay = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  var TODAY = startOfDay(new Date());

  var INIT = { me: "Вы", other: "Другой человек", both: "Взаимно" };
  var OUT = { good: "Хорошее общение", short: "Короткое общение", no: "Нет ответа" };
  var STR = { maintain: "Не потерять связь", grow: "Сближаться" };

  var idc = 0;
  function mk(name, note, strategy, intervalDays, addedDaysAgo, interactions) {
    return {
      id: "c" + (++idc),
      name: name,
      note: note,
      strategy: strategy,
      intervalDays: intervalDays,
      addedDate: daysAgo(addedDaysAgo),
      interactions: (interactions || []).map(function (x) {
        return { date: daysAgo(x.d), initiator: x.init, outcome: x.out };
      })
    };
  }

  var contacts = [
    mk("Марина Соколова", "Обсуждали её переезд и новую работу в другом городе.", "grow", 14, 120, [
      { d: 96, init: "me", out: "good" },
      { d: 61, init: "other", out: "good" },
      { d: 30, init: "both", out: "good" },
      { d: 16, init: "other", out: "good" }
    ]),
    mk("Дмитрий Кузнецов", "Бывший коллега, вместе запускали проект.", "maintain", 30, 200, [
      { d: 150, init: "me", out: "good" },
      { d: 88, init: "me", out: "short" },
      { d: 32, init: "me", out: "good" }
    ]),
    mk("Анна Верещагина", "Двоюродная сестра, живёт в Казани.", "maintain", 21, 90, [
      { d: 70, init: "both", out: "good" },
      { d: 44, init: "me", out: "good" },
      { d: 9, init: "both", out: "good" }
    ]),
    mk("Игорь Лебедев", "Познакомились на конференции по дизайну.", "grow", 10, 50, [
      { d: 38, init: "other", out: "good" },
      { d: 22, init: "me", out: "short" },
      { d: 4, init: "other", out: "short" }
    ]),
    mk("Ольга Панина", "Тренер по бегу, помогала готовиться к марафону.", "maintain", 45, 140, [
      { d: 120, init: "me", out: "good" },
      { d: 20, init: "me", out: "good" }
    ]),
    mk("Сергей Матвеев", "Познакомились на дне рождения у Павла.", "grow", 14, 2, [])
  ];

  var fmtD = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short" });
  var fmtFull = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  function fmtDate(d) { return fmtD.format(d).replace(".", ""); }
  function plural(n, forms) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return forms[0];
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms[1];
    return forms[2];
  }
  function daysWord(n) { return plural(n, ["день", "дня", "дней"]); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }
  function initials(name) {
    var p = name.trim().split(/\s+/);
    return ((p[0] ? p[0][0] : "") + (p[1] ? p[1][0] : "")).toUpperCase();
  }

  function stats(c) {
    var anchor = c.interactions.length
      ? new Date(Math.max.apply(null, c.interactions.map(function (i) { return i.date.getTime(); })))
      : c.addedDate;
    var next = addDays(anchor, c.intervalDays);
    var due = TODAY.getTime() >= startOfDay(next).getTime();
    var overdue = due ? Math.round((TODAY - startOfDay(next)) / DAY) : 0;
    var until = Math.round((startOfDay(next) - TODAY) / DAY);
    var elapsed = Math.max(0, Math.round((TODAY - startOfDay(anchor)) / DAY));
    var p = Math.max(6, Math.min(100, Math.round((elapsed / c.intervalDays) * 100)));
    return { anchor: anchor, next: next, due: due, overdue: overdue, until: until, elapsed: elapsed, p: p };
  }

  function sortedContacts() {
    var arr = contacts.map(function (c) { return { c: c, s: stats(c) }; });
    var due = arr.filter(function (x) { return x.s.due; }).sort(function (a, b) { return a.s.next - b.s.next; });
    var rest = arr.filter(function (x) { return !x.s.due; }).sort(function (a, b) { return a.s.next - b.s.next; });
    return { due: due, rest: rest };
  }

  function whenText(s) {
    if (s.due) return s.overdue > 0 ? "просрочено на " + s.overdue + " " + daysWord(s.overdue) : "пора связаться сегодня";
    if (s.until === 0) return "сегодня";
    return "через " + s.until + " " + daysWord(s.until);
  }

  var state = {
    variant: "a",
    screen: "list",
    listState: "loading",
    selectedId: null,
    draft: { name: "", note: "", strategy: null },
    nameError: false,
    strategyError: false,
    log: { open: false, initiator: null, outcome: null },
    banner: null
  };

  var appRoot = document.getElementById("appRoot");
  var catInfo = document.getElementById("catInfo");

  var VARIANTS = {
    a: {
      name: "Тихий",
      dir: "Нейтральный контрастный минимализм. Список без карточек, тонкие разделители, спокойная иерархия и один сигнальный цвет.",
      type: "Golos Text — единое семейство; табличные цифры для интервалов.",
      space: "Стандартная плотность, шкала 16–24px.",
      colors: [["#0e7c6b", "акцент"], ["#b45309", "пора"], ["#f6f7f9", "фон"], ["#15171c", "текст"]]
    },
    b: {
      name: "Ритм",
      dir: "Компактный, карточки с визуализацией ритма: прогресс-кольцо и крупное число дней до контакта.",
      type: "Unbounded для чисел и заголовков; Manrope для текста.",
      space: "Компактная плотность, шкала 8–20px.",
      colors: [["#4f46e5", "акцент"], ["#e11d48", "пора"], ["#f4f5f8", "фон"], ["#171a21", "текст"]]
    },
    c: {
      name: "Дневник",
      dir: "Редакционный журнал: строки-записи с левым гаттером дат, крупная типографика, много воздуха.",
      type: "Lora (serif) для имён; Golos Text для текста; JetBrains Mono для дат.",
      space: "Расслабленная плотность, шкала 20–32px.",
      colors: [["#1d4ed8", "акцент"], ["#b42318", "пора"], ["#fafafb", "фон"], ["#1a1a1e", "текст"]]
    }
  };

  var iconPersonPlus = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M3.6 20a5.4 5.4 0 0 1 10.8 0"/><path d="M18.5 6.5v5M21 9h-5"/></svg>';
  var iconAlert = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21 19H3z"/><path d="M12 9.5v4.2M12 16.6h.01"/></svg>';

  function barHTML(title, back, sub) {
    return '<div class="app-bar"><div class="bar-row">' +
      (back ? '<button class="bar-back" type="button" data-action="back" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>' : '') +
      '<div class="bar-titles"><span class="bar-title">' + esc(title) + '</span>' +
      (sub ? '<span class="bar-sub">' + esc(sub) + '</span>' : '') + '</div></div></div>';
  }

  function bannerHTML() {
    if (!state.banner) return "";
    var b = state.banner;
    return '<div class="banner">' +
      '<span class="od-fill banner-main"><span class="banner-title">' + esc(b.title) + '</span>' +
      b.lines.map(function (l) { return '<span class="banner-line">' + esc(l) + '</span>'; }).join("") +
      '</span><button class="banner-close" type="button" data-action="dismiss-banner" aria-label="Закрыть">×</button></div>';
  }

  function skeletonHTML() {
    var rows = "";
    for (var i = 0; i < 5; i++) {
      rows += '<div class="skel-row"><span class="skel-av"></span><span class="od-fill od-stack"><span class="skel-line w70"></span><span class="skel-line w45"></span></span></div>';

  }

  function emptyHTML() {
    return '<div class="state"><div class="state-icon" aria-hidden="true">' + iconPersonPlus + '</div>' +
      '<h2 class="state-title">Пока никого нет</h2>' +

      '<button class="btn btn-primary" type="button" data-action="open-add">Добавить человека</button></div>';
  }

  function errorHTML() {
    return '<div class="state"><div class="state-icon" aria-hidden="true">' + iconAlert + '</div>' +
      '<h2 class="state-title">Не удалось показать контакты</h2>' +
      '<p class="state-text">Данные хранятся только на устройстве. Попробуйте ещё раз.</p>' +
      '<button class="btn" type="button" data-action="retry">Повторить</button></div>';
  }

  function rowA(item) {
    var c = item.c, s = item.s;
    return '<li><button class="row-a" type="button" data-action="open-contact" data-id="' + c.id + '">' +
      '<span class="avatar" aria-hidden="true">' + esc(initials(c.name)) + '</span>' +

      (s.due ? '<span class="due-chip">Пора связаться</span>' : '<span class="row-a-when">' + (s.until === 0 ? "сегодня" : "через " + s.until + " дн.") + '</span>') +
      '</button></li>';
  }

  function cardB(item) {
    var c = item.c, s = item.s;
    return '<article class="card-b' + (s.due ? " is-due" : "") + '"><button class="card-b-tap" type="button" data-action="open-contact" data-id="' + c.id + '">' +
      '<span class="ring" style="--p:' + s.p + ';--ring-color:' + (s.due ? "var(--due)" : "var(--accent)") + '"><span class="ring-in">' + c.intervalDays + '</span></span>' +
      '<span class="od-fill card-b-main"><span class="card-b-name">' + esc(c.name) + '</span>' +
      '<span class="card-b-note od-truncate">' + esc(c.note || "Без заметки") + '</span>' +
      '<span class="card-b-meta">раз в ' + c.intervalDays + ' ' + daysWord(c.intervalDays) + ' · ' + whenText(s) + '</span></span>' +
      '</button></article>';
  }

  function entryC(item) {
    var c = item.c, s = item.s;
    return '<li><button class="entry-c" type="button" data-action="open-contact" data-id="' + c.id + '">' +
      '<span class="gutter-c"><span class="gutter-num">' + c.intervalDays + '</span><span class="gutter-unit">дн.</span></span>' +
      '<span class="od-fill entry-c-main"><span class="entry-c-name">' + esc(c.name) + '</span>' +
      '<span class="entry-c-note od-truncate">' + esc(c.note || "Без заметки") + '</span>' +
      '<span class="entry-c-when">' + (s.due ? "пора связаться" : "следующий контакт · " + fmtDate(s.next)) + '</span></span>' +
      (s.due ? '<span class="entry-c-mark">пора</span>' : '') +
      '</button></li>';
  }

  function listBodyHTML() {
    var g = sortedContacts();
    var v = state.variant;
    if (v === "a") {
      var out = "";
      if (g.due.length) {
        out += '<section class="sec"><div class="sec-head"><h2 class="sec-title">Пора связаться</h2><span class="sec-count">' + g.due.length + '</span></div><ul class="rows rows-due">' + g.due.map(rowA).join("") + '</ul></section>';
      }
      out += '<section class="sec"><div class="sec-head"><h2 class="sec-title">Остальные</h2></div><ul class="rows">' + g.rest.map(rowA).join("") + '</ul></section>';
      return out;
    }
    if (v === "b") {
      var o = "";
      if (g.due.length) {
        o += '<section class="sec"><div class="sec-head"><h2 class="sec-title">Пора связаться</h2><span class="sec-count">' + g.due.length + '</span></div>' + g.due.map(cardB).join("") + '</section>';
      }
      o += '<section class="sec"><div class="sec-head"><h2 class="sec-title">Остальные</h2></div>' + g.rest.map(cardB).join("") + '</section>';
      return o;
    }
    var h = "";
    if (g.due.length) h += '<section class="sec"><h2 class="sec-title-c">пора связаться</h2><ul class="ledger">' + g.due.map(entryC).join("") + '</ul></section>';
    h += '<section class="sec"><h2 class="sec-title-c">остальные</h2><ul class="ledger">' + g.rest.map(entryC).join("") + '</ul></section>';
    return h;
  }

  function listHTML() {
    var body = state.listState === "loading" ? skeletonHTML()
      : state.listState === "empty" ? emptyHTML()
      : state.listState === "error" ? errorHTML()
      : listBodyHTML();
    var g = contacts.length ? sortedContacts() : { due: [] };
    var sub = state.listState === "data" ? (contacts.length + " " + plural(contacts.length, ["контакт", "контакта", "контактов"]) + (g.due.length ? " · " + g.due.length + " пора связаться" : "")) : "Локально на устройстве";
    var foot = state.listState === "data" ? '<button class="btn btn-primary btn-block" type="button" data-action="open-add">Добавить человека</button>' : "";
    return '<div class="app-screen">' + barHTML("Orbit", false, sub) +
      '<div class="app-body">' + bannerHTML() + body + '</div>' +
      '<div class="app-foot">' + foot + '</div></div>';
  }

  function strategyOpt(value) {
    var on = state.draft.strategy === value;
    var t = value === "maintain"
      ? { title: "Не потерять связь", desc: "Спокойный ритм, чтобы не быть навязчивым. Интервал может постепенно расти и никогда не сокращается ради сближения." }
      : { title: "Сближаться", desc: "Постепенное сближение, но только по взаимности: интервал сокращается лишь тогда, когда инициатива идёт от другого человека и общение прошло хорошо." };
    return '<button type="button" class="' + (on ? "sopt is-on" : "sopt") + '" data-action="pick-strategy" data-value="' + value + '" aria-pressed="' + on + '">' +
      '<span class="sopt-mark" aria-hidden="true"></span>' +
      '<span class="od-fill sopt-main"><span class="sopt-title">' + t.title + '</span><span class="sopt-desc">' + t.desc + '</span></span></button>';
  }

  function addHTML() {
    var d = state.draft;
    var valid = d.name.trim() !== "" && !!d.strategy;
    return '<div class="app-screen">' + barHTML("Новый контакт", true, "Добавление контакта") +
      '<div class="app-body">' + bannerHTML() +
      '<form class="form" autocomplete="off" onsubmit="return false">' +
      '<label class="field"><span class="label">Имя <span class="req">обязательно</span></span>' +
      '<input class="input" data-field="name" value="' + esc(d.name) + '" placeholder="Например, Марина Соколова" aria-invalid="' + (state.nameError ? "true" : "false") + '">' +
      (state.nameError ? '<span class="err">Укажите имя — без него контакт не сохранить.</span>' : '') + '</label>' +
      '<label class="field"><span class="label">Заметка <span class="opt">необязательно</span></span>' +
      '<textarea class="input textarea" data-field="note" rows="3" placeholder="О чём стоит помнить при общении">' + esc(d.note) + '</textarea></label>' +
      '<fieldset class="strategy"><legend class="label">Стратегия связи <span class="req">обязательно</span></legend>' +
      '<p class="helper">Стратегия задаёт ритм общения. Выбор нельзя пропустить — автоматического значения нет.</p>' +
      strategyOpt("maintain") + strategyOpt("grow") +
      (state.strategyError ? '<span class="err">Выберите одну из стратегий.</span>' : '') +
      '</fieldset></form></div>' +
      '<div class="app-foot"><button class="btn btn-primary btn-block" type="button" data-action="save-add" aria-disabled="' + (valid ? "false" : "true") + '">Сохранить</button>' +
      (valid ? '' : '<span class="foot-hint">Укажите имя и выберите стратегию</span>') + '</div></div>';
  }

  function historyHTML(c) {
    if (!c.interactions.length) {
      return '<p class="hist-empty">Взаимодействий пока нет. Отсчёт идёт от даты добавления контакта.</p>';
    }
    var list = c.interactions.slice().sort(function (a, b) { return b.date - a.date; });
    return '<ul class="hist">' + list.map(function (i) {
      return '<li class="hist-item"><span class="hist-date">' + fmtDate(i.date) + '</span>' +
        '<span class="od-fill hist-main"><span class="hist-init">' + INIT[i.initiator] + '</span>' +
        '<span class="hist-out">' + OUT[i.outcome] + '</span></span></li>';
    }).join("") + '</ul>';
  }

  function contactBody(c, s) {
    var v = state.variant;
    if (v === "a") {
      return '<div class="contact contact-a">' +
        '<div class="c-head"><span class="c-due' + (s.due ? " is-due" : "") + '">' + (s.due ? "Пора связаться · просрочено на " + s.overdue + " " + daysWord(s.overdue) : "Следующий контакт через " + s.until + " " + daysWord(s.until)) + '</span>' +
        '<span class="c-name">' + esc(c.name) + '</span><span class="c-strategy">Стратегия · ' + STR[c.strategy] + '</span></div>' +
        (c.note ? '<p class="c-note">' + esc(c.note) + '</p>' : '') +
        '<dl class="c-facts">' +
        '<div class="c-fact"><dt>Рекомендуемый интервал</dt><dd>раз в ' + c.intervalDays + ' ' + daysWord(c.intervalDays) + '</dd></div>' +
        '<div class="c-fact"><dt>Опорная дата</dt><dd>' + fmtFull.format(s.anchor) + '</dd><dd class="c-fact-sub">' + (c.interactions.length ? "последнее взаимодействие" : "дата добавления") + '</dd></div>' +
        '<div class="c-fact"><dt>Следующий контакт</dt><dd>' + fmtFull.format(s.next) + '</dd></div></dl>' +
        '<h3 class="c-h">История взаимодействий</h3>' + historyHTML(c) + '</div>';
    }
    if (v === "b") {
      return '<div class="contact contact-b">' +
        '<div class="c-b-top"><span class="ring" style="--p:' + s.p + ';--ring-color:' + (s.due ? "var(--due)" : "var(--accent)") + '"><span class="ring-in">' + c.intervalDays + '</span></span>' +
        '<span class="od-fill od-stack"><span class="c-name">' + esc(c.name) + '</span><span class="c-strategy-chip">' + STR[c.strategy] + '</span></span></div>' +
        (s.due ? '<div class="c-b-due">Пора связаться · просрочено на ' + s.overdue + ' ' + daysWord(s.overdue) + '</div>' : '') +
        (c.note ? '<p class="c-note">' + esc(c.note) + '</p>' : '') +
        '<div class="c-tiles">' +
        '<div class="c-tile"><span class="c-tile-v">' + c.intervalDays + '</span><span class="c-tile-l">дней интервал</span></div>' +
        '<div class="c-tile"><span class="c-tile-v">' + fmtDate(s.next) + '</span><span class="c-tile-l">следующий контакт</span></div>' +
        '<div class="c-tile"><span class="c-tile-v">' + c.interactions.length + '</span><span class="c-tile-l">взаимодействий</span></div></div>' +
        '<h3 class="c-h">История</h3>' + historyHTML(c) + '</div>';
    }
    return '<div class="contact contact-c">' +
      '<div class="c-c-kicker">' + (s.due ? "Пора связаться" : "В ритме") + '</div>' +
      '<h2 class="c-c-name">' + esc(c.name) + '</h2>' +
      '<p class="c-c-strategy">' + STR[c.strategy] + '</p>' +
      (c.note ? '<p class="c-c-note">' + esc(c.note) + '</p>' : '') +
      '<div class="c-c-ledger">' +
      '<div><span class="c-c-l">Рекомендуемый интервал</span><span class="c-c-v">раз в ' + c.intervalDays + ' ' + daysWord(c.intervalDays) + '</span></div>' +
      '<div><span class="c-c-l">Опорная дата</span><span class="c-c-v">' + fmtFull.format(s.anchor) + '</span></div>' +
      '<div><span class="c-c-l">Следующий контакт</span><span class="c-c-v' + (s.due ? " is-due" : "") + '">' + fmtFull.format(s.next) + '</span></div></div>' +
      '<h3 class="c-h">История взаимодействий</h3>' + historyHTML(c) + '</div>';
  }

  function contactHTML() {
    var c = contacts.filter(function (x) { return x.id === state.selectedId; })[0] || contacts[0];
    var s = stats(c);
    return '<div class="app-screen">' + barHTML(c.name, true, "Карточка контакта") +
      '<div class="app-body">' + bannerHTML() + contactBody(c, s) + '</div>' +
      '<div class="app-foot"><button class="btn btn-primary btn-block" type="button" data-action="open-log">Зафиксировать общение</button></div></div>';
  }

  function optBtn(group, value, label) {
    var active = (group === "init" ? state.log.initiator : state.log.outcome) === value;
    return '<button type="button" class="' + (active ? "opt is-on" : "opt") + '" data-action="pick-' + group + '" data-value="' + value + '" aria-pressed="' + active + '">' + label + '</button>';
  }

  function sheetHTML() {
    var valid = state.log.initiator && state.log.outcome;
    return '<div class="sheet-scrim" data-action="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Зафиксировать общение">' +
      '<div class="sheet-grip" aria-hidden="true"></div>' +
      '<h2 class="sheet-title">Зафиксировать общение</h2>' +
      '<p class="sheet-sub">Что произошло?</p>' +
      '<div class="sheet-group"><span class="label">Кто был инициатором</span><div class="opts">' +
      optBtn("init", "me", "Вы") + optBtn("init", "other", "Другой человек") + optBtn("init", "both", "Взаимно") + '</div></div>' +
      '<div class="sheet-group"><span class="label">Как прошло</span><div class="opts">' +
      optBtn("out", "good", "Хорошее общение") + optBtn("out", "short", "Короткое общение") + optBtn("out", "no", "Нет ответа") + '</div></div>' +
      (valid ? '' : '<span class="err">Выберите инициатора и результат.</span>') +
      '<button class="btn btn-primary btn-block" type="button" data-action="save-log" aria-disabled="' + (valid ? "false" : "true") + '">Сохранить</button>' +
      '</div></div>';
  }

  function viewHTML() {
    var out = state.screen === "add" ? addHTML() : state.screen === "contact" ? contactHTML() : listHTML();
    if (state.log.open) out += sheetHTML();
    return out;
  }

  var bannerTimer = null;
  function scheduleBanner() {
    if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
    if (!state.banner) return;
    bannerTimer = setTimeout(function () {
      state.banner = null;
      var el = appRoot.querySelector(".banner");
      if (el) { el.classList.add("is-out"); setTimeout(function () { if (el.parentNode) el.remove(); }, 200); }
    }, 7000);
  }

  function updateCatalog() {
    var tabs = document.querySelectorAll("#tabs .tab");
    Array.prototype.forEach.call(tabs, function (b) { b.classList.toggle("is-on", b.getAttribute("data-variant") === state.variant); });
    var segs = document.querySelectorAll("#segStates .seg-btn");
    Array.prototype.forEach.call(segs, function (b) { b.classList.toggle("is-on", b.getAttribute("data-liststate") === state.listState); });
    var v = VARIANTS[state.variant];
    catInfo.innerHTML = '<div class="ci-name">Вариант ' + state.variant.toUpperCase() + ' · ' + v.name + '</div>' +
      '<p class="ci-dir">' + v.dir + '</p>' +
      '<dl class="ci-list"><div><dt>Типографика</dt><dd>' + v.type + '</dd></div>' +
      '<div><dt>Отступы</dt><dd>' + v.space + '</dd></div></dl>' +
      '<div class="ci-swatches">' + v.colors.map(function (c) { return '<span class="sw"><i style="background:' + c[0] + '"></i>' + c[1] + '</span>'; }).join("") + '</div>';
  }

  function render() {
    appRoot.className = "app v-" + state.variant;
    appRoot.innerHTML = viewHTML();
    updateCatalog();
    scheduleBanner();
  }

  function logInterval(c, init, out) {
    var before = c.intervalDays;
    var after = before;
    if (c.strategy === "maintain") {
      if (out === "good") after = Math.min(before + 7, 180);
      else if (out === "short") after = Math.min(before + 3, 180);
    } else {
      if (init === "other" && out === "good") after = Math.max(3, before - 7);
    }
    c.intervalDays = after;
    c.interactions.push({ date: new Date(), initiator: init, outcome: out });
    return after;
  }

  function doSaveLog() {
    if (!state.log.initiator || !state.log.outcome) return;
    var c = contacts.filter(function (x) { return x.id === state.selectedId; })[0];
    if (!c) return;
    var init = state.log.initiator, out = state.log.outcome;
    var before = c.intervalDays;
    var after = logInterval(c, init, out);
    var s = stats(c);
    var delta = after > before
      ? "Интервал вырос: " + before + " → " + after + " " + daysWord(after)
      : after < before
        ? "Интервал сокращён: " + before + " → " + after + " " + daysWord(after)
        : "Интервал без изменений: " + after + " " + daysWord(after);
    state.banner = {
      title: "Общение зафиксировано",
      lines: [INIT[init] + " · " + OUT[out].toLowerCase(), delta, "Следующий контакт: " + fmtFull.format(s.next)]
    };
    state.log = { open: false, initiator: null, outcome: null };
    render();
  }

  function doSaveAdd() {
    var okName = state.draft.name.trim() !== "";
    var okStrategy = !!state.draft.strategy;
    if (!okName || !okStrategy) {
      state.nameError = !okName;
      state.strategyError = !okStrategy;
      render();
      return;
    }
    var strategy = state.draft.strategy;
    var interval = strategy === "grow" ? 14 : 30;
    contacts.push(mk(state.draft.name.trim(), state.draft.note.trim(), strategy, interval, 0, []));
    state.draft = { name: "", note: "", strategy: null };
    state.nameError = false;
    state.strategyError = false;
    state.screen = "list";
    state.listState = "data";
    state.banner = {
      title: "Контакт добавлен",
      lines: ["Стратегия: " + STR[strategy], "Раз в " + interval + " " + daysWord(interval) + " · отсчёт от даты добавления"]
    };
    render();
  }

  appRoot.addEventListener("click", function (e) {
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var a = t.getAttribute("data-action");
    if (a === "close-sheet") {
      if (e.target.classList.contains("sheet-scrim")) {
        state.log = { open: false, initiator: null, outcome: null };
        render();
      }
      return;
    }
    if (a === "open-add") { state.screen = "add"; render(); return; }
    if (a === "back") { state.screen = "list"; state.log = { open: false, initiator: null, outcome: null }; render(); return; }
    if (a === "open-contact") { state.selectedId = t.getAttribute("data-id"); state.screen = "contact"; render(); return; }
    if (a === "pick-strategy") { state.draft.strategy = t.getAttribute("data-value"); state.strategyError = false; render(); return; }
    if (a === "save-add") { doSaveAdd(); return; }
    if (a === "open-log") { state.log = { open: true, initiator: null, outcome: null }; render(); return; }
    if (a === "pick-init") { state.log.initiator = t.getAttribute("data-value"); render(); return; }
    if (a === "pick-out") { state.log.outcome = t.getAttribute("data-value"); render(); return; }
    if (a === "save-log") { doSaveLog(); return; }
    if (a === "retry") {
      state.listState = "loading";
      render();
      setTimeout(function () { state.listState = "data"; render(); }, 700);
      return;
    }
    if (a === "dismiss-banner") { state.banner = null; render(); return; }
  });

  appRoot.addEventListener("input", function (e) {
    var f = e.target.closest("[data-field]");
    if (!f) return;
    var key = f.getAttribute("data-field");
    state.draft[key] = f.value;
    if (key === "name" && state.nameError && f.value.trim() !== "") {
      state.nameError = false;
      var err = f.parentElement.querySelector(".err");
      if (err) err.remove();
    }
  });

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-variant]");
    if (tab) { state.variant = tab.getAttribute("data-variant"); render(); return; }
    var seg = e.target.closest("[data-liststate]");
    if (seg) {
      var v = seg.getAttribute("data-liststate");
      state.screen = "list";
      if (v === "loading") {
        state.listState = "loading";
        render();
        setTimeout(function () { if (state.listState === "loading") { state.listState = "data"; render(); } }, 800);
      } else {
        state.listState = v;
        render();
      }
      return;
    }
  });

  render();
  setTimeout(function () { if (state.listState === "loading") { state.listState = "data"; render(); } }, 850);
})();
</script>
</body>
</html>
